[project]
name = "inclusion-financiere"
version = "0.1.0"
description = "Prédire la détention d'un compte bancaire en Afrique de l'Est (Zindi / FinScope) : pipeline sans fuite, réglage, calibration, seuil selon les coûts, SHAP."
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "catboost>=1.2.10",
    "ipywidgets>=8.1.9",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
